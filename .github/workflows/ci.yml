name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra test --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
      - name: Validate distribution metadata and PyPI README rendering
        run: uvx --from 'twine>=6' twine check --strict dist/*
      - name: Verify standalone wheel and packaged specification
        run: |
          uv venv /tmp/core-wheel
          uv pip install --python /tmp/core-wheel/bin/python dist/*.whl
          /tmp/core-wheel/bin/python tests/wheel_smoke.py
      - name: Run conformance tests against the installed wheel outside the checkout
        run: |
          wheel=$(realpath dist/*.whl)
          uv pip install --python /tmp/core-wheel/bin/python "${wheel}[conformance]"
          uv pip check --python /tmp/core-wheel/bin/python
          cp -r tests /tmp/core-wheel-tests
          cd /tmp
          /tmp/core-wheel/bin/python -I -m pytest -q /tmp/core-wheel-tests
  windows-wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Verify base wheel without Unix resource APIs
        shell: pwsh
        run: |
          $coreEnv = Join-Path $env:RUNNER_TEMP "core-wheel"
          uv venv $coreEnv
          $corePython = Join-Path $coreEnv "Scripts/python.exe"
          uv pip install --python $corePython (Get-ChildItem dist/*.whl).FullName
          & $corePython tests/wheel_smoke.py
