name: Docs

# Read the Docs hosts the full site. Pages deploys redirects for existing bookmarks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group docs
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: uv run --group docs pytest -q docs/tests
      - run: uv run --group docs python docs/catalogue.py
      - run: uv run ruff check docs
      - run: uv run ruff format --check docs
      - run: uv run --group docs mkdocs build --strict
      - run: python scripts/build_docs_redirects.py
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-redirects

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
