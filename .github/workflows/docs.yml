name: Docs

# Checks the documentation on every pull request. GitHub Pages publishing remains enabled during the
# Read the Docs transition; see docs/index.md for the cutover and old-URL redirect steps.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group docs
      - run: uv run --group docs pytest -q docs/tests
      - run: uv run --group docs python docs/catalogue.py
      - run: uv run ruff check docs
      - run: uv run ruff format --check docs
      - run: uv run --group docs mkdocs build --strict
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
