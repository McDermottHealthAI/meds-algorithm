name: Docs

# Read the Docs hosts the site. This workflow only validates documentation changes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group docs
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: uv run --group docs pytest -q docs/tests
      - run: uv run --group docs python docs/catalogue.py
      - run: uv run ruff check docs
      - run: uv run ruff format --check docs
      - run: uv run --group docs mkdocs build --strict
