[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meds-algorithm"
version = "0.4.0a5"
description = "Shared MEDS algorithm contracts and conformance boundaries."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
data = ["polars>=1"]
orchestration = ["hydra-core>=1.3.2,<1.4", "submitit>=1.5.2,<2"]
conformance = ["pytest>=8", "polars>=1", "pyarrow>=15", "meds-evaluation==0.0.3"]
test = ["pytest>=8", "polars>=1", "pyarrow>=15", "meds-evaluation==0.0.3", "hydra-core>=1.3.2,<1.4", "submitit>=1.5.2,<2"]

[project.scripts]
meds-algorithm-spec = "meds_algorithm.spec:main"
meds-algorithm-resolve-input = "meds_algorithm.artifacts.inputs:main"
meds-algorithm-add-to-meds-dev = "meds_algorithm.integrations.meds_dev:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meds_algorithm"]

[tool.hatch.build.targets.wheel.force-include]
"ARCHITECTURE.md" = "meds_algorithm/ARCHITECTURE.md"

# Discovery metadata and its documentation tooling evolve independently of runtime releases.
[tool.hatch.build.targets.sdist]
exclude = ["/catalogue", "/docs", "/mkdocs.yml", "/redirects", "/site-redirects", "/node_modules", "/package.json", "/package-lock.json", "/.cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "meds_dev: opt-in MEDS-DEV integration acceptance",
  "real_data: opt-in MIMIC-IV demo acceptance",
  "slow: integration requiring isolated environments or algorithm execution",
]

[project.urls]
Repository = "https://github.com/McDermottHealthAI/meds-algorithm"
Documentation = "https://meds-algorithm.readthedocs.io/en/latest/"

[dependency-groups]
dev = ["ruff"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "jinja2>=3.1", "packaging>=24", "pytest>=8"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
