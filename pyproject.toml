[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meds-model-core"
version = "0.3.0a1"
description = "Shared MEDS model contracts and conformance boundaries."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[project.optional-dependencies]
data = ["polars>=1"]
test = ["pytest>=8", "polars>=1"]

[project.scripts]
meds-model-core-spec = "meds_model_core.spec:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meds_model_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/florian6973/meds-model-core"

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
